name: Schedule CI

# Schedule daily runs at midnight SGT
on:
  schedule:
    - cron: '0 1 * * *'   # 09:00 BJT
    - cron: '0 7 * * *'   # 15:00 BJT
    - cron: '0 12 * * *'  # 20:00 BJT

# Ensure only one workflow runs at a time
concurrency:
  group: schedule-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-upstream:
    name: Sync from upstream repo (okx/xlayer-erigon)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Add upstream remote
        run: git remote add upstream https://github.com/okx/xlayer-erigon.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream/dev into current branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git merge --no-edit upstream/dev || {
            echo "::error ::Merge conflict detected. Please resolve manually.";
            exit 1;
          }

      - name: Push merged changes back to origin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }} HEAD:${{ github.ref_name }}

  # Run the main CI workflow first
  ci-zkevm:
    name: Run CI Tests
    needs: sync-upstream
    uses: ./.github/workflows/ci_zkevm.yml
    secrets: inherit

  # Run resequence tests after CI
  resequence:
    name: Run Resequence Tests
    needs: ci-zkevm
    uses: ./.github/workflows/test-resequence.yml
    secrets: inherit

  # Run unwinds tests after CI
  unwinds:
    name: Run Unwinds Tests
    needs: ci-zkevm
    uses: ./.github/workflows/test-unwinds.yml
    secrets: inherit
